{% extends 'base.html' %}
{% block titulo %}Ingresar{% endblock %}
{% block contenido %}
<div class="card login-card mx-auto mt-4">
  <div class="card-header"><i class="bi bi-box-arrow-in-right me-1"></i> Iniciar sesión</div>
  <div class="card-body">
    {% if form.errors %}
      <div class="alert alert-danger">Usuario o contraseña incorrectos. Intenta de nuevo.</div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="mb-3">
        <label for="id_username" class="form-label">Usuario</label>
        <input type="text" name="username" id="id_username" class="form-control" autofocus required>
      </div>
      <div class="mb-3">
        <label for="id_password" class="form-label">Contraseña</label>
        <input type="password" name="password" id="id_password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Ingresar</button>
    </form>
  </div>
</div>
{% endblock %}
